<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Orbit — CSS Screensaver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" tabindex="0" aria-label="Midnight Orbit screensaver. Hover over or focus this area to animate the planets.">
    <div class="stars" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="orbit orbit-one" aria-hidden="true"><div class="planet planet-one"></div></div>
    <div class="orbit orbit-two" aria-hidden="true"><div class="planet planet-two"></div></div>
    <div class="orbit orbit-three" aria-hidden="true"><div class="planet planet-three"></div></div>
    <div class="sun" aria-hidden="true"></div>
    <div class="intro">
      <p class="eyebrow">AN INTERACTIVE SCREENSAVER</p>
      <h1>Midnight Orbit</h1>
      <p class="instruction">Hover anywhere to bring the universe to life</p>
      <p class="touch-instruction">Tap here to focus and start the motion</p>
    </div>
    <p class="footer">HTML + CSS ONLY <span>✦</span> MOVE YOUR CURSOR AWAY TO PAUSE</p>
  </main>
</body>
</html>
